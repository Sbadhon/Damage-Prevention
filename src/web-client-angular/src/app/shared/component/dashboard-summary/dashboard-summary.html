<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
  <mat-card
    *ngFor="let stat of stats"
    class="stat-card dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl p-4 flex items-center shadow-sm"
  >
    <div class="p-3 rounded-full mr-4" [ngClass]="stat.color"></div>
    <div>
      <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">
        {{ stat.title }}
      </p>
      <p class="text-2xl font-bold text-gray-900 dark:text-white">
        {{ stat.value }}
      </p>
    </div>
  </mat-card>
</div>
