<form
  class="space-y-4"
  (ngSubmit)="submit()"
>
  <h2 class="text-lg font-semibold text-gray-900 dark:text-white mb-2">
    Create New Ticket
  </h2>

  <mat-form-field
    appearance="fill"
    class="w-full"
  >
    <mat-label>Description</mat-label>
    <input
      matInput
      [(ngModel)]="description"
      name="description"
      required
    />
  </mat-form-field>

  <mat-form-field
    appearance="fill"
    class="w-full"
  >
    <mat-label>Work Type</mat-label>
    <input
      matInput
      [(ngModel)]="workType"
      name="workType"
      required
    />
  </mat-form-field>

  <mat-form-field
    appearance="fill"
    class="w-full"
  >
    <mat-label>Address</mat-label>
    <input
      matInput
      [(ngModel)]="address"
      name="address"
      required
      (blur)="onAddressBlur()"
    />
  </mat-form-field>

  <div
    *ngIf="loadingCoords()"
    class="flex items-center gap-2 text-sm text-gray-500"
  >
    <mat-progress-spinner
      diameter="20"
      mode="indeterminate"
    ></mat-progress-spinner>
    <span>Fetching coordinates…</span>
  </div>

  <div
    #mapContainer
    class="h-64 w-full mt-2 rounded-md border border-gray-200 dark:border-gray-700"
  ></div>

  <div class="flex justify-end gap-2 mt-4">
    <button
      type="button"
      class="px-4 py-2 text-sm font-medium shadow hover:shadow-md
            bg-teal-600 hover:bg-teal-700 text-white rounded-lg"
            (click)="close()"
      >
      Close
    </button>

    <button
      type="submit"
      mat-raised-button
      color="primary"
      [disabled]="isSubmitting()"
    >
      {{ isSubmitting() ? 'Submitting…' : 'Create Ticket' }}
    </button>
  </div>
</form>
