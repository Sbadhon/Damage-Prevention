<div class="flex h-screen">
  <aside
    class="w-64 bg-white dark:bg-gray-800 p-4 flex flex-col justify-between border-r border-gray-200 dark:border-gray-700"
  >
    <div>
      <nav>
        <ul>
          <li class="my-2" *ngFor="let item of navItems">
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-teal-500 text-white shadow-lg"
              [routerLinkActiveOptions]="{ exact: true }"
              class="flex items-center p-3 cursor-pointer rounded-lg transition-all duration-200 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white"
            >
              <span class="ml-4 font-medium">
                {{ item.label }}
              </span>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <div class="space-y-2">
      <div class="text-center text-gray-500 dark:text-gray-400 text-xs">
        <p>&copy; 2025 Damage Prevention</p>
        <p>Version 1.1.0</p>
      </div>
    </div>
  </aside>
</div>
