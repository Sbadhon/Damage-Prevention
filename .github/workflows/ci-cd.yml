name: Damage Prevention SaaS CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - "v*"   # Trigger workflow for version tags
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: "9.0.x"
  SOLUTION_FILE: "DamagePreventionSaaS.sln"
  FRONTEND_DIR: "src/web-client-angular" 

jobs:
  # ======================
  # Frontend (Angular 20)
  # ======================
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            ${{ env.FRONTEND_DIR }}/package-lock.json
            ${{ env.FRONTEND_DIR }}/npm-shrinkwrap.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Run Angular unit tests (CI mode)
        run: npm run test:ci

      - name: Build Angular app
        run: npm run build -- --configuration=production

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dp-frontend-dist
          path: ${{ env.FRONTEND_DIR }}/dist  

  # ======================
  # Backend (.NET + Release)
  # ======================
  build_test_publish:
    runs-on: ubuntu-latest
    needs: frontend 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
            **/packages.lock.json

      - name: Restore
        run: dotnet restore $SOLUTION_FILE

      - name: Build (Release)
        run: dotnet build $SOLUTION_FILE --configuration Release --no-restore

      - name: Test
        run: dotnet test $SOLUTION_FILE --configuration Release --no-build --verbosity normal

      - name: Publish services (Release artifacts)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p ./publish

          dotnet publish src/Services/TicketSvc/TicketSvc.csproj \
            -c Release -o ./publish/TicketSvc

          dotnet publish src/Services/RiskSvc/RiskSvc.csproj \
            -c Release -o ./publish/RiskSvc

          dotnet publish src/Services/SchedulingSvc/SchedulingSvc.csproj \
            -c Release -o ./publish/SchedulingSvc

          dotnet publish src/Gateway/Gateway.csproj \
            -c Release -o ./publish/Gateway

      - name: Upload publish artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: dp-saas-release
          path: publish

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automated release generated by CI/CD pipeline.
          artifacts: publish/**/*
          draft: false
          prerelease: false
